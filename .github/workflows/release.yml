name: Release

# Only fires for a merged PR titled exactly "Release-vX.Y.Z" — regular
# merges to main are handled by ci.yml (tests) and deploy.yml (deploy) and
# do NOT go through this workflow.
on:
  pull_request:
    types: [closed]
    branches:
      - main

permissions:
  contents: write

jobs:
  release:
    name: Tag release and generate changelogs
    if: github.event.pull_request.merged == true && startsWith(github.event.pull_request.title, 'Release-v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0

      - name: Extract and validate version from PR title
        id: version
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          if [[ ! "$PR_TITLE" =~ ^Release-v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            echo "::error::PR title '$PR_TITLE' doesn't match Release-vX.Y.Z (e.g. Release-v1.2.0)."
            exit 1
          fi
          version="${BASH_REMATCH[1]}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: Find previous release tag
        id: previous_tag
        run: |
          tag=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Generate changelogs and bump package.json version
        run: |
          node scripts/generate-changelog.mjs \
            "${{ steps.version.outputs.version }}" \
            "${{ steps.previous_tag.outputs.tag }}"

      - name: Commit changelogs and version bump
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md CHANGELOG-DEV.md package.json
          git commit -m "chore(release): $TAG [skip deploy]"
          git push origin HEAD:main

      - name: Tag release
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          git tag "$TAG"
          git push origin "$TAG"

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          gh release create "$TAG" \
            --title "$TAG" \
            --notes-file /tmp/release-notes.md
